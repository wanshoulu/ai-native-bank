[project]
name = "finance-guardrail"
version = "0.1.0"
description = "智能体安全防护服务 - 基于 LangGraph 的输入/输出双向安全检测"
readme = "readme.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core
    "fastapi==0.135.3",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    # AI/ML - 保持 langchain 和 langgraph 版本
    "langchain==1.2.17",
    "langchain-openai>=1.0.0,<1.2.0",
    "langchain-core>=1.2.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",
    "langgraph==1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.0",
    # Security - GuardRails AI
    "guardrails-ai==0.10.0",
    # PII Detection - Microsoft Presidio
    "presidio-analyzer==2.2.362",
    "presidio-anonymizer==2.2.362",
    # spaCy and Chinese segmentation (required by Presidio zh model)
    "spacy>=3.8.0,<4.0.0",
    "spacy-pkuseg>=0.0.27,<0.1.0",
    # spacy-pkuseg 二进制与 numpy 2.x 不兼容，必须钉在 1.x
    "numpy==1.26.4",
    # Data processing
    "pydantic>=2.7.4,<2.13.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    # HTTP client - 满足 langgraph-sdk 需求
    "httpx>=0.25.2,<0.30.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # Database
    "sqlalchemy==2.0.49",
    "aiosqlite==0.22.1",
    "openinference-instrumentation-langchain>=0.1.70",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.21.2",
    "black>=23.11.0,<24.0.0",
    "flake8>=6.1.0,<7.0.0",
    "mypy>=1.7.0,<2.0.0",
]
