name: ai-native-bank-guardrail-lab

services:
  guardrail-native-tests:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_VERSION: "0.8.22"
    image: ai-native-bank-guardrail-lab:test
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /app/runtime-data:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
      - /app/logs:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    environment:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_MODEL: ""
      EMBEDDING_BASE_URL: ""
      EMBEDDING_MODEL: ""
      PHOENIX_ENABLED: "False"
      DATABASE_URL: "sqlite+aiosqlite:////app/runtime-data/finance_guardrail.db"
      CHECKPOINTER_DB_PATH: "/app/runtime-data/checkpoints.db"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    restart: "no"

  guardrail-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_VERSION: "0.8.22"
    image: ai-native-bank-guardrail-lab:test
    command:
      - python
      - /opt/guardrail-adapters/run_with_ai_harbor_token.py
      - uv
      - run
      - --frozen
      - python
      - /opt/guardrail-adapters/hardened_server.py
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /app/runtime-data:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
      - /app/logs:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    environment:
      AI_BANK_AGENT_RUNTIME_TOKEN_FILE: "/run/ai-bank-secrets/runtime-token"
      PORT: "8000"
      HOST: "0.0.0.0"
      DEBUG: "False"
      RELOAD: "False"
      PHOENIX_ENABLED: "False"
      DATABASE_URL: "sqlite+aiosqlite:////app/runtime-data/finance_guardrail.db"
      CHECKPOINTER_DB_PATH: "/app/runtime-data/checkpoints.db"
    volumes:
      - ai-native-bank-agent-secrets:/run/ai-bank-secrets:ro
    networks:
      - ai-harbor
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 3g
    cpus: 2.0
    restart: "no"

volumes:
  ai-native-bank-agent-secrets:
    external: true
    name: vscode_ai-native-bank-agent-secrets

networks:
  ai-harbor:
    external: true
    name: vscode_default
